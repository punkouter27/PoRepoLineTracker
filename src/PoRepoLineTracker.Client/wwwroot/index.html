<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Track lines of code across all your GitHub repositories with PoRepoLineTracker." />
    <meta name="color-scheme" content="light dark" />
    <meta property="og:title" content="PoRepoLineTracker" />
    <meta property="og:description" content="Track lines of code across all your GitHub repositories." />
    <meta property="og:type" content="website" />
    <title>PoRepoLineTracker</title>
    <base href="/" />
    <link rel="manifest" href="manifest.json" />

    <!-- No font links. Radzen's theme stylesheet below declares both families the app uses
         ("Roboto" and "Material Symbols") against woff2 files it ships under _content/, so the
         two Google Fonts stylesheets that used to sit here fetched a second copy of Roboto and a
         "Material Icons" family nothing references — two render-blocking third-origin requests,
         and the reason icons fell back to ligature text when offline. -->
    <link id="radzen-theme" rel="stylesheet" href="_content/Radzen.Blazor/css/material-base.css" />
    <link rel="stylesheet" href="css/app.css" />
    <!-- effects.css AFTER app.css: it redefines glass tokens per theme and layers motion
         utilities over the shell, so it must win on equal specificity. -->
    <link rel="stylesheet" href="css/effects.css" />

    <!-- SVG first, PNG second. Browsers pick the last icon they understand, so an engine without
         image/svg+xml support falls through to the raster without any scripting. -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="PoRepoLineTracker.Client.styles.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_content/Radzen.Blazor/Radzen.Blazor.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
    <!-- Animated background; on unless localStorage 'backdrop' is 'off'. Deferred, so
         it runs after the boot script below has stamped data-theme — it reads the theme's colours. -->
    <script src="js/backdrop.js" defer></script>
    <!-- Sound, the particle overlay, SVG filters and pointer effects (js/fx.js). Deferred for the
         same reason: it reads prefersReducedMotion and soundOn from the boot script below. -->
    <script src="js/fx.js" defer></script>
    <script>
        // Paint a theme without recording a choice. `data-theme` is what app.css keys
        // off, so it must be set on every path — previously it was only set when the
        // user actively toggled, which left the OS-dark case styled as light.
        function applyTheme(theme) {
            var link = document.getElementById('radzen-theme');
            if (link) {
                link.href = theme === 'dark'
                    ? '_content/Radzen.Blazor/css/material-dark.css'
                    : '_content/Radzen.Blazor/css/material-base.css';
            }
            document.documentElement.setAttribute('data-theme', theme);
        }

        // Explicit user choice: paint it and remember it.
        function setTheme(theme) {
            applyTheme(theme);
            localStorage.setItem('theme', theme);
        }

        function prefersDark() {
            return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        }

        // Read once by AnimatedNumber so a count-up tween can skip straight to its target instead
        // of animating, for the same OS preference app.css's reduced-motion block already honours
        // for every CSS animation.
        function prefersReducedMotion() {
            return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        }

        // What the app is actually showing right now — MainLayout reads this to seed
        // its toggle so the icon cannot disagree with the page.
        function getEffectiveTheme() {
            return document.documentElement.getAttribute('data-theme') || 'light';
        }

        // getViewportWidth() removed: MainLayout now uses <RadzenMediaQuery>, which subscribes to
        // matchMedia and keeps tracking. The one-shot interop it replaced sampled the width once
        // on first render, so a rotate never updated the drawer's breakpoint state.

        // Resolve the theme before first paint: saved choice wins, else the OS
        // preference. Deliberately not persisted, so a user who has never chosen
        // keeps following their OS when it changes.
        (function () {
            var saved = localStorage.getItem('theme');
            applyTheme(saved || (prefersDark() ? 'dark' : 'light'));

            if (!saved && window.matchMedia) {
                window.matchMedia('(prefers-color-scheme: dark)')
                    .addEventListener('change', function (e) {
                        if (!localStorage.getItem('theme')) applyTheme(e.matches ? 'dark' : 'light');
                    });
            }
        })();

        // ── Install prompt ──────────────────────────────────────────────────────────
        //
        // Captured HERE, in the boot script, rather than in a module the app imports
        // later. `beforeinstallprompt` fires once and does not replay: on a warm load
        // Chromium can raise it before the WASM runtime has finished starting, and a
        // listener attached after that point never hears about it — the install button
        // then never appears for exactly the returning users most likely to want it.
        //
        // The event is also the ONLY way to know the browser considers the app
        // installable. There is no queryable "is installable" state, which is why the
        // button is driven by a listener instead of a poll.
        var deferredInstallPrompt = null;
        var installListener = null;

        function notifyInstallAvailability(available) {
            // Fire-and-forget: the .NET side may already be gone (navigation, teardown),
            // and a rejected interop call must not take out the page.
            if (installListener) {
                installListener.invokeMethodAsync('OnInstallAvailabilityChanged', available)
                    .catch(function () { installListener = null; });
            }
        }

        window.addEventListener('beforeinstallprompt', function (e) {
            // Suppressing the browser's own mini-infobar is what earns the right to
            // show the prompt later from our own button.
            e.preventDefault();
            deferredInstallPrompt = e;
            notifyInstallAvailability(true);
        });

        window.addEventListener('appinstalled', function () {
            deferredInstallPrompt = null;
            notifyInstallAvailability(false);
        });

        // Returns the state as of NOW, so a component that mounts after the event has
        // already fired gets the right answer without waiting for a second one that
        // will never come.
        function registerInstallListener(dotNetRef) {
            installListener = dotNetRef;
            return deferredInstallPrompt !== null;
        }

        function unregisterInstallListener() {
            installListener = null;
        }

        async function promptInstall() {
            if (!deferredInstallPrompt) return false;

            deferredInstallPrompt.prompt();
            var choice = await deferredInstallPrompt.userChoice;

            // Spent either way: the captured event cannot be prompted twice, so a
            // dismissed prompt has to retire the button until the browser offers a new
            // one.
            deferredInstallPrompt = null;
            notifyInstallAvailability(false);
            return choice.outcome === 'accepted';
        }

        // ── Sound switch ────────────────────────────────────────────────────────────
        //
        // Off unless the header toggle has stored 'sound' = 'on' — the same shape as the theme:
        // setSound records the choice, and every cue in js/fx.js reads it, so the page that raises
        // a cue needs to know nothing about the toggle. Here rather than in fx.js because
        // MainLayout reads it on first render, and a switch must not depend on the decoration.
        function soundOn() {
            try { return localStorage.getItem('sound') === 'on'; } catch (e) { return false; }
        }

        function setSound(on) {
            try { localStorage.setItem('sound', on ? 'on' : 'off'); } catch (e) { }
            // Called from the toggle's click: a context created or resumed inside a user gesture
            // is one the browser's autoplay policy lets play later, when an analysis finishes.
            if (on && window.playCue) playCue('done');
        }

        // Network status detection for offline read mode.
        //
        // One pair of window listeners for the life of the page, forwarding to whichever
        // component is currently registered — the same shape as the install listener above. They
        // used to be added per registration with no way to remove them, so each closed over a
        // .NET reference that OfflineIndicator had since disposed and threw on the next event.
        var networkListener = null;

        function notifyNetworkStatus(online) {
            if (networkListener) {
                networkListener.invokeMethodAsync('SetOnlineStatus', online)
                    .catch(function () { networkListener = null; });
            }
        }

        window.addEventListener('online', function () { notifyNetworkStatus(true); });
        window.addEventListener('offline', function () { notifyNetworkStatus(false); });

        function registerNetworkStatusListener(dotNetRef) {
            networkListener = dotNetRef;
            return navigator.onLine !== false;
        }

        function unregisterNetworkStatusListener() {
            networkListener = null;
        }

        // ── Year in Review helpers ──────────────────────────────────────────────────
        //
        // Local minus UTC, in minutes (the opposite sign of getTimezoneOffset). Read here because
        // the trimmed WASM runtime may not carry time-zone data, so TimeZoneInfo.Local can be UTC.
        function utcOffsetMinutes() {
            return -new Date().getTimezoneOffset();
        }

        // Rasterises an inline <svg> to a PNG download, with no library: serialise it, load it
        // as an image, draw it on a canvas at 2x, save. A data: URL rather than a blob: one,
        // because img-src in the CSP allows data: and not blob:. The SVG must be self-contained
        // (literal colours, system fonts): page CSS does not reach an SVG loaded as an image.
        function downloadSvgAsPng(svg, fileName) {
            return new Promise(function (resolve, reject) {
                var box = svg.viewBox.baseVal;
                var clone = svg.cloneNode(true);
                clone.setAttribute('width', box.width);
                clone.setAttribute('height', box.height);
                var source = new XMLSerializer().serializeToString(clone);
                var image = new Image();
                image.onload = function () {
                    try {
                        var canvas = document.createElement('canvas');
                        canvas.width = box.width * 2;
                        canvas.height = box.height * 2;
                        var context = canvas.getContext('2d');
                        context.scale(2, 2);
                        context.drawImage(image, 0, 0, box.width, box.height);
                        var link = document.createElement('a');
                        link.download = fileName;
                        link.href = canvas.toDataURL('image/png');
                        link.click();
                        resolve();
                    } catch (e) { reject(e); }
                };
                image.onerror = function () { reject(new Error('The card could not be drawn.')); };
                image.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(source);
            });
        }

        // Already installed and launched from the home screen — there is nothing left to
        // offer, and `navigator.standalone` covers iOS, which does not implement
        // display-mode.
        function isStandalone() {
            return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
                || window.navigator.standalone === true;
        }

        // Registered on load rather than immediately: installing a worker competes with
        // the framework download for connections, and the shell it caches is the one
        // that just finished loading anyway.
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('service-worker.js').catch(function (err) {
                    // A blocked or unsupported worker costs the install prompt and offline
                    // load, not the app. Logged, not surfaced.
                    console.warn('Service worker registration failed', err);
                });
            });
        }
    </script>
</body>

</html>
